name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  fast-approx-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # The optimize_prep fast-approximation layer and its tests are pure
        # NumPy — no SQL Server, no pandas, no QuantLib. Keep this minimal so
        # the check stays fast and green without the full pipeline stack.
        # labbank_common's rate-model tests add pandas + openpyxl (Excel input check).
        # irrbb_calc shock / fixing-rule tests add sqlalchemy (imported, never connected).
        # balance_generate / cash_flow_calc tests add scipy + QuantLib, and pyodbc: their
        # modules build the SQL engine at import (never connected; the runner has unixODBC).
        run: pip install numpy pandas openpyxl sqlalchemy pyodbc scipy QuantLib pytest

      - name: Run test suites
        run: >-
          pytest optimize_prep/tests/ labbank_common/tests/ irrbb_calc/tests/
          balance_generate/tests/ cash_flow_calc/tests/ release_check/ -q
